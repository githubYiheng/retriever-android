org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

kotlin.code.style=official

# AGP 9 内置 Kotlin 集成（与 revenue-dog 一致）：不 apply `org.jetbrains.kotlin.android`。
android.builtInKotlin=true

# ---- Maven 坐标与 POM 元数据（照 revenue-dog）----
# 坐标：org.revdog:retriever:<VERSION_NAME>、org.revdog:retriever-timber:<VERSION_NAME>。
# 每个 library 模块在自己的 gradle.properties 里给 POM_ARTIFACT_ID / POM_NAME / POM_DESCRIPTION。
# SDK 版本号：**必须与 RetrieverVersion.CURRENT 一致**（单测 VersionTest 锁定）。
GROUP=org.revdog
VERSION_NAME=0.1.0
POM_URL=https://github.com/githubYiheng/retriever-android
POM_SCM_URL=https://github.com/githubYiheng/retriever-android
POM_SCM_CONNECTION=scm:git:git://github.com/githubYiheng/retriever-android.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/githubYiheng/retriever-android.git
POM_LICENCE_NAME=The MIT License (MIT)
POM_LICENCE_URL=https://opensource.org/licenses/MIT
POM_LICENCE_DIST=repo
POM_DEVELOPER_ID=loomalabs
POM_DEVELOPER_NAME=Looma Labs
